# ===================================================================
# Rentify Application Configuration
# Enterprise Rental Platform: Identity & Property Verification,
# Real-Time WebSocket Chat, WebRTC Video/Screen-sharing & Admin Hub
# ===================================================================

spring.application.name=Rentify
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL with embedded H2 fallback)
# -------------------------------------------------------------------
# Default to H2 in-memory/file for instant zero-dependency out-of-the-box runtime,
# seamless switchable to PostgreSQL via environment variables or profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rentifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (for monitoring/dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# File Upload Limits (IDs, Title Deeds, Scans)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
rentify.security.jwt.secret=${JWT_SECRET:rentify_enterprise_super_secure_jwt_signing_key_2026_very_long_secret_key_384_bits!}
rentify.security.jwt.expiration-ms=86400000
rentify.security.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:3000,null,*

# -------------------------------------------------------------------
# Azure Cloud Services Configuration
# -------------------------------------------------------------------
# Azure Blob Storage
azure.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=rentifystorage;AccountKey=mockKey==;EndpointSuffix=core.windows.net}
azure.blob.container-name=${AZURE_STORAGE_CONTAINER:rentify-documents}
azure.blob.sas-token-duration-minutes=60
azure.blob.mock-mode=${AZURE_MOCK_MODE:true}
azure.blob.local-storage-path=./data/storage/

# Azure AI Document Intelligence (Form Recognizer)
azure.ai.document-intelligence.endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:https://rentify-doc-intelligence.cognitiveservices.azure.com/}
azure.ai.document-intelligence.api-key=${AZURE_DOCUMENT_INTELLIGENCE_KEY:mock_doc_key}
azure.ai.document-intelligence.mock-mode=${AZURE_DOC_MOCK_MODE:true}

# Azure Face API & Liveness Detection
azure.ai.face.endpoint=${AZURE_FACE_ENDPOINT:https://rentify-face-api.cognitiveservices.azure.com/}
azure.ai.face.api-key=${AZURE_FACE_KEY:mock_face_key}
azure.ai.face.mock-mode=${AZURE_FACE_MOCK_MODE:true}

# -------------------------------------------------------------------
# Verification Confidence Thresholds
# -------------------------------------------------------------------
rentify.verification.face-match-threshold=0.85
rentify.verification.liveness-confidence-threshold=0.80
rentify.verification.ownership-name-match-threshold=0.82
rentify.verification.corporate-ownership-threshold=0.80
rentify.verification.agent-authorization-threshold=0.85

# -------------------------------------------------------------------
# WebRTC & Signaling Configuration
# -------------------------------------------------------------------
rentify.webrtc.ice-servers=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
