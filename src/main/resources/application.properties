# ===================================================================
# Rentify Application Configuration
# Enterprise Rental Platform: Identity & Property Verification,
# Real-Time WebSocket Chat, WebRTC Video/Screen-sharing & Admin Hub
# ===================================================================

spring.application.name=Rentify
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MongoDB with embedded H2 fallback and redis)
# -------------------------------------------------------------------
# Default to H2 in-memory/file for instant zero-dependency out-of-the-box runtime,
# seamless switchable to PostgreSQL via environment variables or profile
spring.datasource.url=${mongodb+srv://<DB_USERNAME>:<DB_PASSWORD>@cluster0.20tdgzh.mongodb.net/rentify_db?retrywrites=true&w=majority}
spring.data.mongodb.auto-index-creation=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis configuration(caching, sessions and rate limiting)
spring.data.rediis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=$(REDIS_PASSWORD)
spring.data.redis.timeout=20000ms

# Enable Spring Cache backed by Redis(10-minute default TTL)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# -------------------------------------------------------------------
# File Upload Limits (IDs, Title Deeds, Scans)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
rentify.security.jwt.secret=${JWT_SECRET}
rentify.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
rentify.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# -------------------------------------------------------------------
# Azure Cloud Services Configuration
# -------------------------------------------------------------------
# Azure Blob Storage
azure.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.blob.container-name=${AZURE_STORAGE_CONTAINER}
azure.blob.sas-token-duration-minutes=60
azure.blob.mock-mode=${AZURE_BLOBB_MOCK_MODE}
azure.blob.local-storage-path=${AZURE_BLOB_LOCAL_PATH}

# Azure AI Document Intelligence (Form Recognizer)
azure.ai.document-intelligence.endpoint=${azure.ai.document-intelligence.endpoint}
azure.ai.document-intelligence.api-key=${azure.ai.document-intelligence.api-key}
azure.ai.document-intelligence.mock-mode=${azure.ai.document-intelligence.mock-mode}

# Azure Face API & Liveness Detection
azure.ai.face.endpoint=${azure.ai.face.endpoint}
azure.ai.face.api-key=${azure.ai.face.api-key}
azure.ai.face.mock-mode=${azure.ai.face.mock-mode}

# -------------------------------------------------------------------
# Verification Confidence Thresholds
# -------------------------------------------------------------------
rentify.verification.face-match-threshold=0.85
rentify.verification.liveness-confidence-threshold=0.80
rentify.verification.ownership-name-match-threshold=0.82
rentify.verification.corporate-ownership-threshold=0.80
rentify.verification.agent-authorization-threshold=0.85

# -------------------------------------------------------------------
# WebRTC & Signaling Configuration
# -------------------------------------------------------------------
rentify.webrtc.ice-servers=${rentify.webrtc.ice-servers}
