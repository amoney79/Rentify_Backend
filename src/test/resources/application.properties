# Test configuration - overrides main application.properties for test context

# MongoDB: use embedded Flapdoodle (spring-boot-starter-data-mongodb-test)
spring.mongodb.uri=mongodb://localhost/rentify_test
spring.data.mongodb.auto-index-creation=false

# Redis: disable for tests (no Redis in test env)
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# JWT - use a fixed test secret
rentify.security.jwt.secret=dGVzdFNlY3JldEtleUZvclVuaXRUZXN0czEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
rentify.security.jwt.expiration-ms=86400000
rentify.security.cors.allowed-origins=http://localhost:3000

# Azure mocks (already default to mock mode)
azure.blob.mock-mode=true
azure.ai.document-intelligence.mock-mode=true
azure.ai.face.mock-mode=true

# WebRTC - dummy for tests
rentify.webrtc.ice-servers=stun:stun.l.google.com:19302
